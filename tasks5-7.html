<!DOCTYPE html>
<html>

<body>
    <h2>Каталог товаров</h2>

    <div id="products"></div>
    <p id="cartMessage"></p>

    <hr>
    <input type="text" id="search" placeholder="Поиск товара">

    <select id="category">
        <option value="Все">Все категории</option>
        <option value="Периферия">Периферия</option>
        <option value="Техника">Техника</option>
    </select>

    <select id="sort">
        <option value="default">Без сортировки</option>
        <option value="asc">Сначала дешевле</option>
        <option value="desc">Сначала дороже</option>
    </select>

    <hr>
    <h2>Корзина</h2>

    <div id="cart"></div>
    <h3 id="totalPrice">Общая сумма: 0₽</h3>

    <script>
        const products = [
            {
                id: 1,
                title: "Мышь",
                price: 1000,
                category: "Периферия"
            },
            {
                id: 2,
                title: "Клавиатура",
                price: 3000,
                category: "Периферия"
            },
            {
                id: 3,
                title: "Монитор",
                price: 15000,
                category: "Техника"
            }
        ]
        const cart = []

        const productsContainer = document.querySelector("#products")
        const cartMessage = document.querySelector("#cartMessage")
        const search = document.querySelector("#search")
        const category = document.querySelector("#category")
        const sort = document.querySelector("#sort")
        const cartContainer = document.querySelector("#cart")
        const totalPrice = document.querySelector("#totalPrice")

        function renderProducts() {
            productsContainer.innerHTML = ""

            let result = [...products]

            result = result.filter(product => {
                return product.title
                    .toLowerCase()
                    .includes(search.value.toLowerCase())
            })

            if (category.value !== "Все") {
                result = result.filter(product => {
                    return product.category === category.value
                })
            }

            if (sort.value === "asc") {
                result.sort((a, b) => a.price - b.price)
            }

            if (sort.value === "desc") {
                result.sort((a, b) => b.price - a.price)
            }

            result.forEach(product => {
                const card = document.createElement("div")

                card.classList.add("product")
                card.dataset.id = product.id

                card.innerHTML = `
                    <h3>${product.title}</h3>
                    <p>${product.price} ₽</p>
                    <p>${product.category}</p>

                    <button class="cartButton">
                        В корзину
                    </button>

                    <button class="deleteButton">
                        Удалить
                    </button>`

                productsContainer.append(card)
            })
        }
        renderProducts()

        search.addEventListener("input", renderProducts)
        category.addEventListener("change", renderProducts)
        sort.addEventListener("change", renderProducts)

        function renderCart() {
            cartContainer.innerHTML = ""

            let total = 0

            cart.forEach(item => {
                total += item.price * item.count

                const card = document.createElement("div")

                card.dataset.id = item.id

                card.innerHTML = `
                    <h4>${item.title}</h4>

                    <p>Цена: ${item.price} ₽</p>

                    <p>Количество: ${item.count}</p>

                    <button class="removeCart">
                        Удалить
                    </button>`

                cartContainer.append(card)
            })

            totalPrice.textContent = `Общая сумма: ${total}₽`

        }

        productsContainer.addEventListener("click", (event) => {
            const card = event.target.closest(".product")

            if (!card) { return }

            const id = Number(card.dataset.id)

            const product = products.find((item) => {
                return item.id === id
            })

            if (event.target.classList.contains("deleteButton")) {
                const index = products.indexOf(product)

                products.splice(index, 1)

                renderProducts()
            }

            if (event.target.classList.contains("cartButton")) {
                const cartProduct = cart.find(item => item.id === product.id)

                if (cartProduct) {
                    cartProduct.count++
                } else {
                    cart.push({
                        id: product.id,
                        title: product.title,
                        price: product.price,
                        count: 1
                    })
                }

                cartMessage.innerHTML = `<i>Товар "${product.title}" добавлен в корзину</i>`
                renderCart()
            }
        })

        cartContainer.addEventListener("click", event => {
            if (!event.target.classList.contains("removeCart")) { return }

            const card = event.target.closest("div")

            const id = Number(card.dataset.id)

            const index = cart.findIndex(item => item.id === id)

            if (index !== -1) {
                cart.splice(index, 1)
                renderCart()
            }
        })
    </script>
</body>

</html>
