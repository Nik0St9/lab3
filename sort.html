<!DOCTYPE html>
<html>

<body>
    <h2>Каталог товаров</h2>

    <input type="text" id="search" placeholder="Поиск товара">

    <select id="category">
        <option value="Все">Все категории</option>
        <option value="Периферия">Периферия</option>
        <option value="Техника">Техника</option>
    </select>

    <select id="sort">
        <option value="default">Без сортировки</option>
        <option value="asc">Сначала дешевле</option>
        <option value="desc">Сначала дороже</option>
    </select>

    <hr>
    <div id="catalog"></div>

    <script>
        const products = [
            { title: "Мышь", price: 1000, category: "Периферия" },
            { title: "Клавиатура", price: 3000, category: "Периферия" },
            { title: "Монитор", price: 15000, category: "Техника" },
            { title: "Ноутбук", price: 65000, category: "Техника" }
        ]

        const searchInput = document.getElementById("search")
        const categorySelect = document.getElementById("category")
        const sortSelect = document.getElementById("sort")
        const catalog = document.getElementById("catalog")

        function filterProducts(products, search, category) {
            return products.filter(product => {
                const matchSearch = product.title.toLowerCase().includes(search.toLowerCase())

                const matchCategory = category === "Все" || product.category === category

                return matchSearch && matchCategory
            })
        }

        function sortProducts(products, sortType) {

            const sortedProducts = [...products]

            if (sortType === "asc") {
                sortedProducts.sort((a, b) => a.price - b.price)
            }

            if (sortType === "desc") {
                sortedProducts.sort((a, b) => b.price - a.price)
            }

            return sortedProducts
        }

        // Вывод товаров
        function renderProducts() {

            const filtered = filterProducts(products, searchInput.value, categorySelect.value)

            const sorted = sortProducts(filtered, sortSelect.value)

            catalog.innerHTML = ""

            if (sorted.length === 0) {
                catalog.innerHTML = "<p>Товары не найдены.</p>"
                return
            }

            sorted.forEach(product => {
                catalog.innerHTML += `
                    <div style="border:1px solid black; width:250px; padding:15px; margin:10px; display:inline-block;">
                        <h3>${product.title}</h3>
                        <p>Цена: ${product.price} ₽</p>
                        <p>Категория: ${product.category}</p>
                    </div>`
            })
        }

        searchInput.addEventListener("input", renderProducts)
        categorySelect.addEventListener("change", renderProducts)
        sortSelect.addEventListener("change", renderProducts)

        renderProducts()

    </script>

</body>

</html>
