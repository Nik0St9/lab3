<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Кнопка счётчика</h1>
    <p>
        Значение: <span id="counter">0</span>
    </p>

    <button id="counterButton">Увеличить</button>
    <script>
        let count = 0
        const counter = document.querySelector("#counter")
        const counterButton = document.querySelector("#counterButton")

        counterButton.addEventListener("click", () => {
            count++
            counter.textContent = count
        })
    </script>

    <hr>
    <h2>Live input</h2>
    <input type="text" id="liveInput" placeholder="Введите текст">

    <p id="output">Здесь появится текст</p>
    <Script>
        const liveInput = document.querySelector("#liveInput")
        const output = document.querySelector("#output")

        liveInput.addEventListener("input", () => {

            const text = liveInput.value.trim()

            if (text === "") {
                output.textContent = "Здесь появится текст"
            } else {
                output.textContent = text
            }
        })
    </Script>
</body>

</html>
