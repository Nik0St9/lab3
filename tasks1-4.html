<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Кнопка счётчика</h1>
    <p>
        Значение: <span id="counter">0</span>
    </p>

    <button id="counterButton">Увеличить</button>
    <script>
        let count = 0
        const counter = document.querySelector("#counter")
        const counterButton = document.querySelector("#counterButton")

        counterButton.addEventListener("click", () => {
            count++
            counter.textContent = count
        })
    </script>

    <hr>
    <h2>Live input</h2>
    <input type="text" id="liveInput" placeholder="Введите текст">

    <p id="output">Здесь появится текст</p>
    <Script>
        const liveInput = document.querySelector("#liveInput")
        const output = document.querySelector("#output")

        liveInput.addEventListener("input", () => {

            const text = liveInput.value.trim()

            if (text === "") {
                output.textContent = "Здесь появится текст"
            } else {
                output.textContent = text
            }
        })
    </Script>

    <hr>
    <h2>Форма регистрации</h2>
    <form id="registerForm">
        <input type="text" id="name" placeholder="Введите имя">

        <br><br>
        <input type="email" id="email" placeholder="Введите email">

        <br><br>
        <button type="submit">Зарегистрироваться</button>
    </form>

    <p id="errors"></p>
    <div id="result"></div>
    <Script>
        const registerForm = document.querySelector("#registerForm")
        const nameInput = document.querySelector("#name")
        const emailInput = document.querySelector("#email")
        const errors = document.querySelector("#errors")
        const result = document.querySelector("#result")

        registerForm.addEventListener("submit", (event) => {
            event.preventDefault()

            errors.textContent = ""
            result.innerHTML = ""

            const name = nameInput.value.trim()
            const email = emailInput.value.trim()

            if (name === "" || email === "") {
                errors.textContent = "Заполните все поля!"
                return
            }

            result.innerHTML = `
                <h3>Данные пользователя:</h3>
                <p>Имя: ${name}</p>
                <p>Email: ${email}</p>`
        })
    </Script>

    <hr>
    <h2>TODO список</h2>
    <input type="text" id="taskInput" placeholder="Введите задачу">

    <button id="addTask">Добавить</button>

    <p>
        Всего задач: <span id="totalTasks">0</span>
    </p>

    <p>
        Выполнено: <span id="completedTasks">0</span>
    </p>

    <ul id="taskList"></ul>
    <Script>
        const taskInput = document.querySelector("#taskInput")
        const addTask = document.querySelector("#addTask")
        const taskList = document.querySelector("#taskList")
        const totalTasks = document.querySelector("#totalTasks")
        const completedTasks = document.querySelector("#completedTasks")

        const tasks = []

        function renderTasks() {
            taskList.innerHTML = ""

            tasks.forEach((task) => {
                const li = document.createElement("li")

                if (task.completed) {
                    li.classList.add("completed")
                }

                const text = document.createElement("span")
                text.textContent = task.text

                const completeButton = document.createElement("button")
                completeButton.textContent = "готово" 
                completeButton.classList.add("taskButton")

                completeButton.addEventListener("click", () => {
                    task.completed = !task.completed

                    renderTasks()
                })

                const deleteButton = document.createElement("button")
                deleteButton.textContent = "Удалить"
                deleteButton.classList.add("taskButton")

                deleteButton.addEventListener("click", () => {
                    const index = tasks.indexOf(task)

                    tasks.splice(index, 1)

                    renderTasks()
                })

                li.append(text)
                li.append(completeButton)
                li.append(deleteButton)

                taskList.append(li)
            })

            totalTasks.textContent = tasks.length

            const completed = tasks.filter(function (task) {
                return task.completed
            })
            completedTasks.textContent = completed.length
        }

        addTask.addEventListener("click", () => {
            const text = taskInput.value.trim()

            if (text === "") {return}

            tasks.push({
                text: text,
                completed: false
            })

            taskInput.value = ""
            renderTasks()
        })

        renderTasks()
    </Script>
</body>

</html>
