<!DOCTYPE html>
<html>

<body>

    <h2>Профиль пользователя</h2>
    <div id="profile"></div>

    <hr>
    <h2>Карточка товара</h2>
    <div id="productCard"></div>

    <hr>
    <h2>Список пользователей</h2>
    <div id="users"></div>

    <hr>
    <h2>Деструктуризация объекта</h2>
    <div id="destruct"></div>

    <script>
        const users = [
            {
                id: 1,
                name: "Алексей",
                email: "alex@example.com",
                role: "student",
                active: true
            },
            {
                id: 2,
                name: "Мария",
                email: "maria@example.com",
                role: "teacher",
                active: false
            },
            {
                id: 3,
                name: "Иван",
                email: "ivan@example.com",
                role: "admin",
                active: true
            }
        ]
        const user = {
            id: 1,
            name: "Алексей",
            age: 25,
            email: "alex@example.com",
            role: "student"
        }
        const product = {
            title: "Ноутбук",
            price: 70000,
            specs: {
                cpu: "Intel Core i5",
                ram: "16 GB",
                storage: "512 GB SSD"
            }
        }

        const profile = document.getElementById("profile")
        const productCard = document.getElementById("productCard")

        profile.innerHTML = `
            <div style="border:1px solid black; padding:0 15px; width:250px; margin-bottom:20px;">
                <h3>${user.name}</h3>
                <p><b>ID:</b> ${user.id}</p>
                <p><b>Возраст:</b> ${user.age}</p>
                <p><b>Email:</b> ${user.email}</p>
                <p><b>Роль:</b> ${user.role}</p>
            </div>`

        productCard.innerHTML = `
            <div style="border:1px solid black; padding:0 15px; width:300px;">
                <h3>${product.title}</h3>
                <p><b>Цена:</b> ${product.price} ₽</p>

                <h4>Характеристики:</h4>
                <ul>
                    <li>Процессор: ${product.specs.cpu}</li>
                    <li>Оперативная память: ${product.specs.ram}</li>
                    <li>Накопитель: ${product.specs.storage}</li>
                </ul>
            </div>`

        const usersBlock = document.getElementById("users")

        users.forEach(user => {
            usersBlock.innerHTML += `
            <div style="border:1px solid black; padding:0 15px; width:250px; margin-bottom:15px; display:inline-block">
                <h3>${user.name}</h3>
                <p><b>ID:</b> ${user.id}</p>
                <p><b>Email:</b> ${user.email}</p>
                <p><b>Роль:</b> ${user.role}</p>
                <p><b>Статус:</b> ${user.active ? "Активен" : "Неактивен"}</p>
            </div>`
        })

        const { name, email, role } = user
        const destruct = document.getElementById("destruct")

        destruct.innerHTML = `
        <div style="border:1px solid black; padding:0 15px; width:250px;">
            <h3>${name}</h3>
            <p><b>Email:</b> ${email}</p>
            <p><b>Роль:</b> ${role}</p>
        </div>`
    </script>

</body>

</html>
