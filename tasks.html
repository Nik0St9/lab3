<!DOCTYPE html>
<html>

<body>

    <h2>Профиль пользователя</h2>

    <div id="profile"></div>

    <script>
        const user = {
            id: 1,
            name: "Алексей",
            age: 25,
            email: "alex@example.com",
            role: "student"
        }

        const profile = document.getElementById("profile")

        profile.innerHTML = `
            <div style="border:1px solid black; padding:0 15px; width:250px;">
                <h3>${user.name}</h3>
                <p><b>ID:</b> ${user.id}</p>
                <p><b>Возраст:</b> ${user.age}</p>
                <p><b>Email:</b> ${user.email}</p>
                <p><b>Роль:</b> ${user.role}</p>
            </div>`

    </script>

</body>

</html>
