<!DOCTYPE html>
<html>

<body>
    <h2>Подготовленные товары</h2>
    <div id="products"></div>

    <hr>
    <h2>Каталог по категориям</h2>
    <div id="catalog"></div>

    <hr>
    <h2>Списки пользователей</h2>
    <div id="usersInfo"></div>

    <hr>
    <h2>Список заказов</h2>
    <table border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th>№ заказа</th>
                <th>Клиент</th>
                <th>Количество товаров</th>
                <th>Итоговая сумма</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
    </table>

    <script>
        const products = [
            { title: "Мышь", price: 1000, category: "Периферия" },
            { title: "Монитор", price: 15000, category: "Техника" }
        ]
        const categories = [
            "Периферия",
            "Техника",
            "Игры"
        ]
        const users = [
            {
                id: 1,
                name: "Алексей",
                email: "alex@example.com",
                role: "student",
                active: true
            },
            {
                id: 2,
                name: "Мария",
                email: "maria@example.com",
                role: "admin",
                active: false
            },
            {
                id: 3,
                name: "Иван",
                email: "ivan@example.com",
                role: "admin",
                active: true
            },
            {
                id: 4,
                name: "Ольга",
                email: "olga@example.com",
                role: "student",
                active: false
            }
        ]
        const orders = [
            {
                id: 101,
                client: "Алексей",
                status: "Новый",
                products: [
                    { title: "Мышь", price: 1000, quantity: 2 },
                    { title: "Клавиатура", price: 3000, quantity: 1 }
                ]
            },
            {
                id: 102,
                client: "Мария",
                status: "Оплачен",
                products: [
                    { title: "Монитор", price: 15000, quantity: 1 },
                    { title: "Коврик", price: 500, quantity: 2 }
                ]
            },
            {
                id: 103,
                client: "Иван",
                status: "Доставлен",
                products: [
                    { title: "Ноутбук", price: 65000, quantity: 1 },
                    { title: "Мышь", price: 1000, quantity: 1 }
                ]
            }
        ]

        const newProducts = products.map(product => ({
            title: product.title,
            price: `${product.price} ₽`,
            category: `Категория: ${product.category}`,
            description: `Товар "${product.title}" доступен к покупке`
        }))

        const productsBlock = document.getElementById("products")

        newProducts.forEach(product => {
            productsBlock.innerHTML += `
                <div style="border:1px solid black; padding:0 15px; width:300px; margin-bottom:15px; display:inline-block;">
                    <h3>${product.title}</h3>
                    <p>${product.price}</p>
                    <p>${product.category}</p>
                    <p>${product.description}</p>
                </div>`
        })

        const catalog = document.getElementById("catalog")

        categories.forEach(category => {

            catalog.innerHTML += `<h3>${category}</h3>`

            const categoryProducts = products.filter(product => {
                return product.category === category
            })

            if (categoryProducts.length === 0) {
                catalog.innerHTML += `<p>Товаров нет.</p>`
            } else {
                categoryProducts.forEach(product => {
                    catalog.innerHTML += `
                        <div style="border:1px solid black; padding:0 15px; width:250px; margin-bottom:15px; display:inline-block;">
                            <h4>${product.title}</h4>
                            <p>Цена: ${product.price} ₽</p>
                        </div>`
                })
            }
        })

        const activeUsers = users.filter(user => user.active)
        const admins = users.filter(user => user.role === "admin")
        const emails = users.map(user => user.email)
        const inactiveCount = users.filter(user => !user.active).length

        const usersInfo = document.getElementById("usersInfo")

        usersInfo.innerHTML = `
            <h3>Активные пользователи</h3>
            <ul>
                ${activeUsers.map(user => `<li>${user.name}</li>`).join("")}
            </ul>

            <h3>Администраторы</h3>
            <ul>
                ${admins.map(user => `<li>${user.name}</li>`).join("")}
            </ul>

            <h3>Email-адреса</h3>
            <ul>
                ${emails.map(email => `<li>${email}</li>`).join("")}
            </ul>

            <h3>Количество неактивных пользователей: ${inactiveCount}</h3>`

        const ordersTable = document.getElementById("ordersTable")

        orders.forEach(order => {

            const totalQuantity = order.products.reduce((sum, product) => {
                return sum + product.quantity
            }, 0)

            const totalPrice = order.products.reduce((sum, product) => {
                return sum + product.price * product.quantity
            }, 0)

            ordersTable.innerHTML += `
                <tr>
                    <td>${order.id}</td>
                    <td>${order.client}</td>
                    <td>${totalQuantity}</td>
                    <td>${totalPrice} ₽</td>
                    <td>${order.status}</td>
                </tr>`
        })
    </script>

</body>

</html>
