<!DOCTYPE html>

<html>

<body>
    <h1>Задача 1</h1>
    <input type="text" id="nameInput" placeholder="Введите имя">
    <button id="greetButton">Приветствие</button>
    <input type="text" id="resultNameInput">

    <script>
        document.getElementById("greetButton").addEventListener('click', () => {
            let text = document.getElementById('nameInput').value;
            let output = document.getElementById('resultNameInput');
            text == '' ? output.value = 'Введите имя' : output.value = 'Привет, "' + text + '"!';
        })
    </script>

    <hr>
    <h1>Задача 2</h1>
    <input type="text" id="costInput" placeholder="Введите цену">
    <input type="text" id="discountInput" placeholder="Введите % скидки">
    <button id="discountButton">Посчитать</button>
    <input type="text" id="ResultCostInput">

    <script>
        document.getElementById('discountButton').addEventListener('click', () => {
            let cost = parseFloat(document.getElementById('costInput').value);
            let discount = parseFloat(document.getElementById('discountInput').value) * 0.01;
            let output = document.getElementById('ResultCostInput');

            if (isNaN(cost) || isNaN(discount)) {
                output.value = 'Некорректный ввод!';
            } else {
                output.value = `Итоговая цена: ${cost - (cost * discount)}₽`;
            }
        });
    </script>

    <hr>
    <h1>Задача 3</h1>
    <input type="number" id="ageInput" placeholder="Введите возраст">
    <button id="checkAgeButton">Проверить</button>
    <input type="text" id="resultAgeInput">

    <script>
        document.getElementById('checkAgeButton').addEventListener('click', () => {
            let age = parseInt(document.getElementById('ageInput').value);
            let output = document.getElementById('resultAgeInput');

            if (isNaN(age) || age < 0) {
                output.value = "Неккоректный ввод!";
            } else {
                switch (true) {
                    case (age < 18):
                        output.value = "Доступ запрещён";
                        break;
                    case (age >= 18 && age < 59):
                        output.value = "Доступ разрешён";
                        break;
                    case (age >= 60):
                        output.value = "Льготная категория";
                        break;
                }
            }
        })
    </script>

    <hr>
    <h1>Задача 5</h1>
    <input type="text" id="productCostInput" placeholder="Введите цену">
    <button id="checkProductCostButton">Узнать</button>
    <input type="text" id="resultProductCostInput">

    <script>
        document.getElementById("checkProductCostButton").addEventListener('click', () => {
            let cost = parseFloat(document.getElementById("productCostInput").value);
            let output = document.getElementById('resultProductCostInput');

            switch (true) {
                case (cost < 0):
                    output.value = "Неккоректное значение!"
                    break;
                case (cost == 0):
                    output.value = "Бесплатно"
                    break;
                case (cost > 0 && cost < 1000):
                    output.value = "Дешевый товар"
                    break;
                case (cost >= 1000 && cost < 10000):
                    output.value = "Обычный товар"
                    break;
                case (cost >= 10000):
                    output.value = "Дорогой товар"
                    break;
            }
        })
    </script>
</body>

</html>
